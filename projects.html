<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Ryan Amponsah | RyanVisuals</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="site-nav">
      <a href="index.html" class="site-nav__logo">Ryan Amponsah</a>
      <ul class="site-nav__list">
        <li class="site-nav__item"><a href="index.html" class="site-nav__link">Home</a></li>
        <li class="site-nav__item"><a href="projects.html" class="site-nav__link" aria-current="page">Projects</a></li>
        <li class="site-nav__item"><a href="contact.html" class="site-nav__link">Contact</a></li>
      </ul>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">🌓</button>
    </nav>
  </header>

  <main>
    <section class="projects">
      <h1 class="projects__title">Projects</h1>

      <div class="projects__controls">
        <label for="project-search" class="projects__label">Search</label>
        <input
          type="text"
          id="project-search"
          class="projects__search"
          placeholder="Search projects..."
        >

        <label for="project-category" class="projects__label">Category</label>
        <select id="project-category" class="projects__filter">
          <option value="all">All</option>
          <option value="branding">Branding</option>
          <option value="marketing-advertising">Marketing & Advertising Design</option>
          <option value="web-development">Web Development</option>
        </select>
      </div>

      <div class="projects__grid" id="projects-grid" aria-live="polite">
        <!-- Cards rendered here by js/projects.js -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p class="site-footer__text">&copy; 2026 Ryan Amponsah — RyanVisuals</p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
